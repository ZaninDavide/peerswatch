<!doctype html>
<head>
  <meta charset="utf-8">
  <meta name="description" content="Enjoy your favorite movies with a friend, even when far apart.">
  <meta name="keywords" content="Watch, Movies, Videos, Player, Sync">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">
  <title>PeersWatch</title>
</head>
<body>
  <div id="connectionPage">
    <div id="infoBox" title="This website uses WebRTC peer-to-peer connection. For testing with two peers on the same machine it may be necessary to turn off media.peerconnection.ice.obfuscate_host_addresses from the about:config page."></div>
    <h1>PeersWatch</h1>
    <p id="connectionPageText">
      Enjoy your favorite movies with a friend, even when far apart: one video, two people.
    </p>
    <p>
      <button id="newRoomButton">NEW ROOM</button>
    </p>
  </div>
  <div id="watchPage" style="display: none">
    <p>
      <a href="/"><button id="backButton" aria-label="Back" title="Back"></button></a>
      <button id="refreshButton" aria-label="Refresh" title="Refresh"></button>
      <input id="videoInput" type="file" accept="video/*"/>
      <span id="peersCounter" title="People in the room" aria-label="Number of people watching including you.">
        <span id="peersCount">1</span>
      </span>  
    </p>
    <video id="videoPlayer" controls></video>
  </div>
  <div id="closedPage" style="display: none">
    <p>Connection closed. Go back to the <a href="/">home</a> page.</p>
  </div>
  <script type="module" src="/dom.js"></script>
  <script type="module" src="/clipboard.js"></script>
  <script type="module" src="/player.js"></script>
  <script type="module" src="/peers.js"></script>
</body>
