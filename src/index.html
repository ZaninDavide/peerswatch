<!doctype html>
<head>
  <meta charset="utf-8">
  <meta name="description" content="Enjoy your favorite movies with a friend, even when far apart.">
  <meta name="keywords" content="Watch, Movies, Videos, Player, Sync">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <title>PeersWatch</title>
</head>
<body>
  <div id="connectionPage">
    <div id="infoBox" title="This website uses WebRTC peer-to-peer connection. For testing with two peers on the same machine it may be necessary to turn off media.peerconnection.ice.obfuscate_host_addresses from the about:config page."></div>
    <h1>PeersWatch</h1>
    <p id="connectionPageText">
      Enjoy your favorite movies with a friend, even when far apart: one video, two people.
    </p>
    <p>
      <button id="offerButton">NEW ROOM</button>
      <input id="offerTextBox" type="text" style="display: none" readonly/>
      <button id="offerCopyButton" style="display: none"></button>      
      <button id="offerShareButton" style="display: none"></button>      
      <button id="connectButton" style="display: none">ACCEPT ANSWER</button>
      <button id="answerButton">JOIN ROOM</button>
      <input id="answerTextBox" type="text" style="display: none" readonly/>
      <button id="answerCopyButton" style="display: none"></button>   
      <button id="answerShareButton" style="display: none"></button>   
    </p>
  </div>
  <div id="watchPage" style="display: none">
    <p>
      <input id="videoInput" type="file" accept="video/*"/>
      <button id="refreshButton">REFRESH</button>
    </p>
    <video id="videoPlayer" controls></video>
  </div>
  <div id="closedPage" style="display: none">
    <p>Connection closed. Go back to the <a href="https://peerswatch.surge.sh">home</a> page.</p>
  </div>
  <script src="dom.js"></script>
  <script src="clipboard.js"></script>
  <script src="player.js"></script>
  <script src="peers.js"></script>
  <script src="urlanswer.js"></script>
</body>
